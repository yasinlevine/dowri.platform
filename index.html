<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1d">
<title>منوی دوری پلتفرم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root {
    --bg: #0a0f1d;
    --text: #f8fafc;
    --muted: #94a3b8;
    --accent: #ef4444;
    --accent-rgb: 239,68,68;
    --coral: #ef4444;
    --card: rgba(255,255,255,0.05);
    --border: rgba(255,255,255,0.10);
    --border-strong: rgba(255,255,255,0.14);
    --hi: rgba(255,255,255,0.08);
    --glow: rgba(239,68,68,0.55);
    --glow-soft: rgba(239,68,68,0.16);
    --field-bg: rgba(255,255,255,0.06);
    --tab-bg: rgba(255,255,255,0.04);
    --shadow: 0 8px 30px rgba(0,0,0,0.28);
    --opt-bg: #111827;
    --dock-bg: rgba(10,15,29,0.78);
    --modal-bg: rgba(15,23,42,.88);
    --price-bg: rgba(239,68,68,0.10);
    --price-border: rgba(239,68,68,0.32);
    --price-color: #f87171;
    --on-accent: #ffffff;
  }
  /* Section 2: "mashad out" — light cream glass theme */
  body[data-brand="mashad"] {
    --bg: #f6efe0;
    --text: #2b2118;
    --muted: #7a6a58;
    --card: rgba(255,255,255,0.58);
    --border: rgba(120,85,40,0.18);
    --border-strong: rgba(120,85,40,0.30);
    --hi: rgba(255,255,255,0.75);
    --glow: rgba(217,119,6,0.55);
    --glow-soft: rgba(217,119,6,0.18);
    --field-bg: rgba(255,255,255,0.70);
    --tab-bg: rgba(255,255,255,0.50);
    --shadow: 0 8px 30px rgba(120,85,40,0.16);
    --opt-bg: #ffffff;
    --dock-bg: rgba(255,250,240,0.82);
    --modal-bg: rgba(255,250,240,.94);
    --price-bg: rgba(217,119,6,0.12);
    --price-border: rgba(180,83,9,0.35);
    --price-color: #b45309;
    --accent: #f59e0b;
    --accent-rgb: 245,158,11;
    --on-accent: #2b1a05;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; color-scheme: dark; }
  body {
    font-family: 'Vazirmatn', system-ui, sans-serif;
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    transition: background-color .5s ease, color .35s ease;
    -webkit-font-smoothing: antialiased;
    touch-action: manipulation;
    overflow-x: hidden;
  }
  /* Fixed GPU-layer backgrounds (no background-attachment jank); cross-fade between brands */
  body::before, body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    transition: opacity .55s ease; will-change: opacity;
  }
  body::before {
    background:
      radial-gradient(650px circle at 90% -5%, rgba(239,68,68,0.16), transparent 60%),
      radial-gradient(600px circle at 5% 25%, rgba(30,58,138,0.42), transparent 60%),
      radial-gradient(700px circle at 50% 110%, rgba(59,130,246,0.12), transparent 60%);
  }
  body::after {
    opacity: 0;
    background:
      radial-gradient(600px circle at 10% -5%, rgba(245,158,11,0.30), transparent 60%),
      radial-gradient(500px circle at 95% 40%, rgba(239,68,68,0.12), transparent 60%),
      radial-gradient(700px circle at 50% 110%, rgba(180,120,50,0.20), transparent 60%),
      #f6efe0;
  }
  body[data-brand="mashad"]::after { opacity: 1; }

  #logoBox { width: 5rem; height: 5rem; transition: width .45s cubic-bezier(.3,1.2,.4,1); }
  body[data-brand="mashad"] #logoBox { width: 8.75rem; }
  #logoImg { transition: opacity .25s ease; }

  .glass {
    background: var(--card);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border: 1px solid var(--border);
    border-radius: 1.15rem;
    box-shadow: var(--shadow), inset 0 1px 0 var(--hi);
    transition: background .35s ease, border-color .3s ease, box-shadow .3s ease, transform .25s cubic-bezier(.2,.8,.2,1);
  }
  @media (hover: hover) {
    .glow:hover {
      border-color: var(--glow);
      box-shadow: 0 0 0 1px var(--glow-soft), 0 14px 44px var(--glow-soft), inset 0 1px 0 var(--hi);
      transform: translateY(-3px);
    }
  }
  .glow:active { transform: scale(.985); }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Brand switcher with sliding pill */
  .brand-dock {
    position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px;
  }
  .brand-pill {
    position: absolute; top: 6px; bottom: 6px; right: 6px;
    width: calc((100% - 18px) / 2); border-radius: .9rem; pointer-events: none;
    transition: transform .4s cubic-bezier(.3,1.25,.4,1), background .4s ease, box-shadow .4s ease;
    will-change: transform;
    background: linear-gradient(135deg,#1e3a8a,#0f1b3d);
    box-shadow: 0 0 24px rgba(59,130,246,.35), inset 0 0 0 1px rgba(147,197,253,.35);
  }
  .brand-dock[data-active="mashad"] .brand-pill {
    transform: translateX(calc(-100% - 6px));
    background: linear-gradient(135deg,#fff7e6,#f3e3c0);
    box-shadow: 0 0 24px rgba(217,119,6,.30), inset 0 0 0 1px rgba(180,120,50,.45);
  }
  .brand-btn {
    position: relative; z-index: 1;
    padding: .8rem 1rem; border-radius: .9rem; font-weight: 800; font-size: 1.08rem;
    color: var(--muted); background: transparent; border: 0;
    cursor: pointer; transition: color .3s ease, transform .15s ease; font-family: inherit; line-height: 1.3;
    min-height: 56px;
  }
  .brand-btn small { display: block; font-weight: 400; font-size: .7rem; opacity: .85; margin-top: 2px; }
  .brand-btn:hover { color: var(--text); }
  .brand-btn:active { transform: scale(.96); }
  .brand-btn.active[data-brand="doori"]  { color: #fff; }
  .brand-btn.active[data-brand="mashad"] { color: #3b2a14; }

  .tab-nav { background: linear-gradient(180deg, var(--bg) 72%, transparent); }
  .tabs-scroll {
    overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain; scroll-padding-inline: 16px; padding: 8px 16px 14px; margin: -6px -16px -8px;
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
            mask-image: linear-gradient(to right, transparent 0, #000 14px, #000 calc(100% - 14px), transparent 100%);
  }
  .tab {
    flex-shrink: 0; scroll-snap-align: center;
    padding: .65rem 1.3rem; border-radius: 999px; white-space: nowrap;
    color: var(--muted); border: 1px solid var(--border);
    background: var(--tab-bg); cursor: pointer; font-weight: 500;
    transition: color .2s ease, background .25s ease, box-shadow .25s ease, transform .15s ease; font-family: inherit;
    min-height: 44px;
  }
  .tab:hover { color: var(--text); }
  .tab:active { transform: scale(.94); }
  .tab.active {
    background: var(--accent); color: var(--on-accent); border-color: var(--accent);
    font-weight: 700; box-shadow: 0 4px 16px rgba(var(--accent-rgb),0.38);
  }

  .badge {
    background: var(--coral); color: #fff; font-size: .7rem; font-weight: 600;
    padding: .15rem .6rem; border-radius: 999px; letter-spacing: .01em;
  }
  .price {
    color: var(--price-color); font-weight: 800; font-size: 1.1rem; font-variant-numeric: tabular-nums;
    background: var(--price-bg); border: 1px solid var(--price-border);
    padding: .3rem .8rem; border-radius: .75rem; white-space: nowrap;
  }
  .price.empty { color: var(--muted); border-color: var(--border); background: var(--tab-bg); }
  .price .sep { color: var(--muted); margin: 0 .25rem; font-weight: 400; }

  .field {
    width: 100%; background: var(--field-bg); color: var(--text);
    border: 1px solid var(--border-strong); border-radius: .75rem;
    padding: .6rem .85rem; outline: none; font-family: inherit; font-size: 16px; /* 16px stops iOS zoom */
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  .field:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb),0.18); }
  .field::placeholder { color: var(--muted); opacity: .7; }
  select.field option { background: var(--opt-bg); color: var(--text); }

  .btn {
    padding: .6rem 1.1rem; border-radius: .8rem; font-weight: 600; cursor: pointer;
    border: 1px solid transparent; font-family: inherit; min-height: 42px;
    transition: filter .2s ease, box-shadow .2s ease, background .2s ease, transform .15s ease;
  }
  .btn:active { transform: scale(.95); }
  .btn-accent { background: var(--accent); color: var(--on-accent); }
  .btn-accent:hover { filter: brightness(1.1); box-shadow: 0 0 18px rgba(var(--accent-rgb),.45); }
  .btn-ghost { background: var(--field-bg); color: var(--text); border-color: var(--border-strong); }
  .btn-ghost:hover { filter: brightness(1.15); }
  .btn-danger { background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.4); }
  .btn-danger:hover { background: rgba(239,68,68,0.3); }

  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  .modal-bg {
    position: fixed; inset: 0; background: rgba(5,8,16,0.75);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    display: none; align-items: center; justify-content: center; z-index: 60; padding: 1rem;
  }
  .modal-bg.show { display: flex; }

  /* Staggered entrance: fade + slide-up */
  .fade-in {
    animation: slideUp .5s cubic-bezier(.2,.8,.2,1) backwards;
    animation-delay: calc(var(--i, 0) * 55ms);
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(18px);} to { opacity: 1; transform: none; } }

  .toast {
    position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(16,185,129,0.95); color: #fff; padding: .6rem 1.2rem; border-radius: .8rem;
    opacity: 0; pointer-events: none; transition: all .3s; z-index: 80; font-size: .9rem;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.err { background: rgba(239,68,68,0.95); }

  /* Mobile-first thumb zone: brand switcher docks to the bottom edge */
  @media (max-width: 639px) {
    body { padding-bottom: calc(6.75rem + env(safe-area-inset-bottom)); }
    .brand-dock {
      position: fixed; z-index: 45; margin: 0 !important;
      left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom));
      background: var(--dock-bg);
      box-shadow: 0 12px 40px rgba(0,0,0,.35), inset 0 1px 0 var(--hi);
    }
    .toast { bottom: calc(7rem + env(safe-area-inset-bottom)); }
  }

  @media (min-width: 640px) {
    .brand-dock { max-width: 460px; margin-inline: auto; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
</head>

  let items = load();
  let activeBrand = 'doori';
  let activeCat = 'coffee';
  let query = '';
  let authed = sessionStorage.getItem(AUTH_KEY) === '1';
  let isAdmin = authed && isAdminRoute();

  // Admin route: https://site/admin  (needs an SPA rewrite on the host)  or  https://site/#admin  (works anywhere)
  function isAdminRoute() {
    return /\/admin\/?$/i.test(location.pathname) || /^#\/?admin\/?$/i.test(location.hash);
  }
  function baseUrl() {
    const path = /\/admin\/?$/i.test(location.pathname) ? location.pathname.replace(/\/admin\/?$/i, '/') : location.pathname;
    return path + location.search;
  }

  function defaults() { return JSON.parse(JSON.stringify(DEFAULT_ITEMS)); }
  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) return parsed;
      }
      // Migrate data saved by the previous version (category "side" became "dip")
      const old = localStorage.getItem(OLD_KEY);
      if (old) {
        const parsed = JSON.parse(old);
        if (Array.isArray(parsed)) {
          const defs = defaults();
          return parsed.map(i => {
            if (i.cat === 'side') i.cat = 'dip';
            const d = defs.find(x => x.id === i.id);
            if (d && !String(i.price || '').trim()) i.price = d.price;
            return i;
          });
        }
      }
    } catch (e) {}
    return defaults();
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    catch (e) { toast('ذخیره‌سازی ممکن نیست', true); }
  }

  // ---------- Helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const catById = (id) => CATEGORIES.find(c => c.id === id);
  const brandById = (id) => BRANDS.find(b => b.id === id) || BRANDS[0];
  const catLabel = (id) => (catById(id) || {}).label || '';
  const brandOfCat = (id) => brandById((catById(id) || {}).brand);
  const toFa = (s) => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
  const normalize = (s) => String(s).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
                                    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))
                                    .replace(/\s+/g, '').replace(/[\\|،,-]/g, '/');
  const buzz = (ms = 8) => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function toast(msg, err) {
    const t = $('#toast');
    t.textContent = msg; t.className = 'toast show' + (err ? ' err' : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.className = 'toast', 1800);
  }
  function renderPrice(price) {
    const p = String(price || '').trim();
    if (!p) return '<span class="price empty">—</span>';
    const parts = p.split('/').map(x => x.trim()).filter(Boolean);
    return '<span class="price">' + parts.map(x => esc(toFa(x))).join('<span class="sep">/</span>') + '</span>';
  }

  // ---------- Render ----------
  function renderBrandSwitch() {
    const sw = $('#brandSwitch');
    sw.dataset.active = activeBrand;
    sw.querySelectorAll('.brand-btn').forEach(b => {
      const on = b.dataset.brand === activeBrand;
      b.classList.toggle('active', on);
      b.setAttribute('aria-selected', on);
    });
    applyIdentity();
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = activeBrand === 'mashad' ? '#f6efe0' : '#0a0f1d';
  }

  function syncNav() {
    const b = brandById(activeBrand);
    $('#tabNav').classList.toggle('hidden', query.trim() !== '' || b.cats.length < 2);
  }

  function renderTabs() {
    const b = brandById(activeBrand);
    syncNav();
    $('#tabs').innerHTML = b.cats.map(id =>
      `<button class="tab ${id === activeCat ? 'active' : ''}" data-cat="${id}" role="tab" aria-selected="${id === activeCat}">${esc(catLabel(id))}</button>`
    ).join('');
    $('#newCat').innerHTML = CATEGORIES.map(c =>
      `<option value="${c.id}">${esc(brandById(c.brand).label)} · ${esc(c.label)}</option>`
    ).join('');
    $('#newCat').value = activeCat;
    const a = $('#tabs .tab.active');
    if (a && a.scrollIntoView) a.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'auto' });
  }

  function renderMenu(animate = true) {
    const q = query.trim().toLowerCase();
    const list = items.filter(i => q
      ? (i.title + ' ' + (i.desc || '')).toLowerCase().includes(q)
      : i.cat === activeCat);

    $('#empty').classList.toggle('hidden', list.length > 0);
    $('#menu').innerHTML = list.map((i, idx) => isAdmin ? adminCard(i, idx, animate) : customerCard(i, idx, !!q, animate)).join('');
  }

  function customerCard(i, idx, showBrand, animate) {
    return `
    <li class="${animate ? 'fade-in' : ''}" style="--i:${Math.min(idx,12)}">
     <div class="glass glow p-4 sm:p-5 flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="flex items-center gap-2 mb-1">
          <span class="badge">${esc(catLabel(i.cat))}</span>
          ${showBrand ? `<span class="text-xs" dir="auto" style="color:var(--muted)">${esc(brandOfCat(i.cat).label)}</span>` : ''}
        </div>
        <h3 class="font-bold text-base sm:text-lg leading-snug">${esc(i.title)}</h3>
        ${i.desc ? `<p class="text-xs mt-1" dir="auto" style="color:var(--muted)">${esc(i.desc)}</p>` : ''}
      </div>
      ${renderPrice(i.price)}
     </div>
    </li>`;
  }

  function adminCard(i, idx, animate) {
    return `
    <li class="${animate ? 'fade-in' : ''}" data-id="${esc(i.id)}" style="--i:${Math.min(idx,12)}">
     <div class="glass p-4">
      <div class="flex items-center justify-between mb-3">
        <span class="badge">${esc(catLabel(i.cat))}</span>
        <button class="btn btn-danger !py-1 !px-3 text-xs" data-del="${esc(i.id)}">حذف</button>
      </div>
      <div class="grid gap-2">
        <input class="field" data-f="title" value="${esc(i.title)}" placeholder="عنوان">
        <input class="field" data-f="desc" value="${esc(i.desc || '')}" placeholder="توضیحات">
        <div class="flex items-center gap-2">
          <label class="text-xs shrink-0" style="color:var(--muted)">قیمت:</label>
          <input class="field" data-f="price" value="${esc(i.price)}" placeholder="مثلاً 110 یا 110/125" dir="ltr" style="text-align:right">
        </div>
      </div>
     </div>
    </li>`;
  }

  function renderAdminUI() {
    $('#adminBar').classList.toggle('hidden', !isAdmin);
    $('#addForm').classList.toggle('hidden', !isAdmin);
  }

  function renderAll() {
    document.body.dataset.brand = activeBrand;
    renderBrandSwitch(); renderTabs(); renderAdminUI(); renderMenu();
  }

  function setBrand(id) {
    activeBrand = id;
    activeCat = brandById(id).cats[0];
    query = ''; $('#search').value = '';
    renderAll();
  }

  // ---------- Events ----------
  $('#brandSwitch').addEventListener('click', e => {
    const b = e.target.closest('[data-brand]'); if (!b) return;
    if (b.dataset.brand !== activeBrand || query) { buzz(10); setBrand(b.dataset.brand); }
  });

  $('#tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-cat]'); if (!b) return;
    if (b.dataset.cat === activeCat) return;
    buzz(6);
    activeCat = b.dataset.cat; $('#search').value = ''; query = '';
    $('#tabs').querySelectorAll('.tab').forEach(t => {
      const on = t === b;
      t.classList.toggle('active', on);
      t.setAttribute('aria-selected', on);
    });
    $('#newCat').value = activeCat;
    b.scrollIntoView({ inline: 'center', block: 'nearest', behavior: 'smooth' });
    renderMenu();
  });

  let searchRaf = 0;
  $('#search').addEventListener('input', e => {
    query = e.target.value;
    cancelAnimationFrame(searchRaf);
    searchRaf = requestAnimationFrame(() => { syncNav(); renderMenu(false); });
  });

  // Inline editing (no re-render while typing so focus is kept)
  $('#menu').addEventListener('input', e => {
    if (!isAdmin) return;
    const f = e.target.dataset.f; if (!f) return;
    const card = e.target.closest('[data-id]');
    const item = items.find(x => x.id === card.dataset.id); if (!item) return;
    item[f] = f === 'price' ? normalize(e.target.value) : e.target.value;
    save();
  });
  $('#menu').addEventListener('change', e => {
    if (e.target.dataset.f === 'price') {
      const card = e.target.closest('[data-id]');
      const item = items.find(x => x.id === card.dataset.id);
      if (item) e.target.value = item.price;
      toast('قیمت ذخیره شد');
    }
  });
  $('#menu').addEventListener('click', e => {
    const d = e.target.closest('[data-del]'); if (!d || !isAdmin) return;
    const item = items.find(x => x.id === d.dataset.del);
    if (item && confirm(`«${item.title}» حذف شود؟`)) {
      items = items.filter(x => x.id !== item.id); save(); renderMenu(); toast('حذف شد');
    }
  });

  $('#btnAdd').addEventListener('click', () => {
    const title = $('#newTitle').value.trim();
    if (!title) { toast('عنوان را وارد کنید', true); return; }
    const cat = $('#newCat').value;
    items.push({
      id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      cat, title,
      desc: $('#newDesc').value.trim(),
      price: normalize($('#newPrice').value)
    });
    save();
    $('#newTitle').value = ''; $('#newDesc').value = ''; $('#newPrice').value = '';
    activeBrand = brandOfCat(cat).id; activeCat = cat; query = ''; $('#search').value = '';
    renderAll(); toast('آیتم اضافه شد');
  });

  // Login
  const modal = $('#loginModal');
  function openLogin() { modal.classList.add('show'); $('#pwErr').classList.add('hidden'); $('#pw').value = ''; setTimeout(() => $('#pw').focus(), 50); }
  function closeLogin() { modal.classList.remove('show'); }
  function cancelLogin() { closeLogin(); if (isAdminRoute()) leaveAdmin(); }
  function tryLogin() {
    if ($('#pw').value === ADMIN_PASSWORD) {
      authed = true; sessionStorage.setItem(AUTH_KEY, '1');
      isAdmin = isAdminRoute();
      closeLogin(); renderAll(); toast('خوش آمدید');
    } else {
      $('#pwErr').classList.remove('hidden');
    }
  }
  // Back to the public menu URL
  function leaveAdmin() {
    try { history.replaceState(null, '', baseUrl()); } catch (e) { location.hash = ''; }
    syncRoute();
  }
  // Decide what to show for the current URL
  function syncRoute() {
    if (isAdminRoute()) {
      if (authed) { isAdmin = true; closeLogin(); renderAll(); }
      else { isAdmin = false; renderAll(); openLogin(); }
    } else {
      isAdmin = false; closeLogin(); renderAll();
    }
  }
  window.addEventListener('hashchange', syncRoute);
  window.addEventListener('popstate', syncRoute);

  $('#btnCancel').addEventListener('click', cancelLogin);
  $('#btnLogin').addEventListener('click', tryLogin);
  $('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
  modal.addEventListener('click', e => { if (e.target === modal) cancelLogin(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal.classList.contains('show')) cancelLogin(); });

  $('#btnLogout').addEventListener('click', () => {
    authed = false; sessionStorage.removeItem(AUTH_KEY); leaveAdmin();
  });
  $('#btnReset').addEventListener('click', () => {
    if (confirm('همه تغییرات پاک شده و منوی اولیه بازگردانده شود؟')) {
      items = defaults(); save(); renderAll(); toast('منو بازنشانی شد');
    }
  });

  // ---------- Brand identity: logo + name follow the active section ----------
  const TITLES = { doori: 'دوری پلتفرم', mashad: 'mashad out' };
  const LOGO_KEYS = { doori: 'cafe_logo_v1', mashad: 'cafe_logo_mashad_v1' };

  const logoImg = $('#logoImg'), logoFallback = $('#logoFallback');
  const DEFAULT_LOGOS = { doori: logoImg.getAttribute('src'), mashad: MASHAD_LOGO };

  function currentLogo() {
    let saved = null;
    try { saved = localStorage.getItem(LOGO_KEYS[activeBrand]); } catch (e) {}
    return saved || DEFAULT_LOGOS[activeBrand];
  }
  function showLogo(src) {
    logoImg.style.opacity = '0';
    logoImg.onload = () => {
      logoImg.classList.remove('hidden'); logoFallback.classList.add('hidden');
      requestAnimationFrame(() => { logoImg.style.opacity = '1'; });
    };
    logoImg.onerror = () => { logoImg.classList.add('hidden'); logoFallback.classList.remove('hidden'); };
    logoImg.src = src;
  }
  function applyIdentity() {
    const name = TITLES[activeBrand];
    $('#brandTitle').textContent = name;
    $('#footName').textContent = '© ' + name;
    document.title = 'منوی ' + name;
    logoImg.alt = 'لوگوی ' + name;
    const src = currentLogo();
    if (logoImg.getAttribute('src') !== src) showLogo(src);
  }
  $('#btnLogo').addEventListener('click', () => $('#logoFile').click());
  $('#logoFile').addEventListener('change', e => {
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 480, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const data = c.toDataURL('image/jpeg', 0.9);
        try { localStorage.setItem(LOGO_KEYS[activeBrand], data); } catch (err) { toast('ذخیره لوگو ممکن نیست', true); return; }
        showLogo(data); toast('لوگو ذخیره شد');
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  });
  $('#btnLogoDel').addEventListener('click', () => {
    try { localStorage.removeItem(LOGO_KEYS[activeBrand]); } catch (e) {}
    showLogo(DEFAULT_LOGOS[activeBrand]); toast('لوگو به حالت پیش‌فرض بازگشت');
  });

  syncRoute();
})();
</script>
